<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="600" fill="#0d0d0d"/>
  <rect x="0" y="0" width="900" height="600" fill="url(#bgGrad)"/>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111118;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a2a2a"/>
      <stop offset="40%" style="stop-color:#3d3d3d"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#888"/>
      <stop offset="50%" style="stop-color:#ccc"/>
      <stop offset="100%" style="stop-color:#888"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d0d0d0"/>
      <stop offset="100%" style="stop-color:#909090"/>
    </linearGradient>
    <linearGradient id="trimBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="40%" style="stop-color:#2d2d42"/>
      <stop offset="100%" style="stop-color:#141420"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="450" x2="900" y2="450"/>
    <line x1="225" y1="0" x2="225" y2="600"/>
    <line x1="450" y1="0" x2="450" y2="600"/>
    <line x1="675" y1="0" x2="675" y2="600"/>
  </g>

  <!-- ===== CLIPPER (links) ===== -->
  <g filter="url(#shadow)" transform="translate(160, 60)">

    <!-- Körper -->
    <rect x="0" y="40" width="100" height="360" rx="18" fill="url(#bodyGrad)"/>

    <!-- Seitenstreifen Silber -->
    <rect x="0" y="40" width="12" height="360" rx="6" fill="url(#silverGrad)" opacity="0.7"/>
    <rect x="88" y="40" width="12" height="360" rx="6" fill="url(#silverGrad)" opacity="0.7"/>

    <!-- Saber Logo-Bereich -->
    <rect x="15" y="100" width="70" height="28" rx="5" fill="#222" opacity="0.8"/>
    <text x="50" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#c8a84b" letter-spacing="2">SABER</text>

    <!-- Power-Button -->
    <circle cx="50" cy="175" r="18" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
    <circle cx="50" cy="175" r="12" fill="#222" stroke="#00e5ff" stroke-width="1.5"/>
    <path d="M50 164 L50 175" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M42 167 A10 10 0 1 0 58 167" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- LED Streifen -->
    <rect x="20" y="210" width="60" height="6" rx="3" fill="#00e5ff" opacity="0.8" filter="url(#glow)"/>

    <!-- Grip-Muster -->
    <g opacity="0.25">
      <rect x="18" y="240" width="64" height="3" rx="1.5" fill="#888"/>
      <rect x="18" y="250" width="64" height="3" rx="1.5" fill="#888"/>
      <rect x="18" y="260" width="64" height="3" rx="1.5" fill="#888"/>
      <rect x="18" y="270" width="64" height="3" rx="1.5" fill="#888"/>
      <rect x="18" y="280" width="64" height="3" rx="1.5" fill="#888"/>
      <rect x="18" y="290" width="64" height="3" rx="1.5" fill="#888"/>
    </g>

    <!-- Akku-Anzeige -->
    <rect x="30" y="320" width="40" height="14" rx="3" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <rect x="32" y="322" width="30" height="10" rx="2" fill="#00e5ff" opacity="0.7"/>
    <rect x="70" y="325" width="4" height="5" rx="1" fill="#333"/>

    <!-- USB-C Port -->
    <rect x="36" y="388" width="28" height="8" rx="4" fill="#111" stroke="#444" stroke-width="1"/>

    <!-- Klinge oben -->
    <rect x="-4" y="10" width="108" height="34" rx="4" fill="url(#bladeGrad)"/>
    <rect x="2" y="6" width="96" height="10" rx="2" fill="#bbb"/>
    <!-- Klingen-Zähne -->
    <g fill="#888">
      <rect x="4"  y="0" width="5" height="8" rx="1"/>
      <rect x="11" y="0" width="5" height="8" rx="1"/>
      <rect x="18" y="0" width="5" height="8" rx="1"/>
      <rect x="25" y="0" width="5" height="8" rx="1"/>
      <rect x="32" y="0" width="5" height="8" rx="1"/>
      <rect x="39" y="0" width="5" height="8" rx="1"/>
      <rect x="46" y="0" width="5" height="8" rx="1"/>
      <rect x="53" y="0" width="5" height="8" rx="1"/>
      <rect x="60" y="0" width="5" height="8" rx="1"/>
      <rect x="67" y="0" width="5" height="8" rx="1"/>
      <rect x="74" y="0" width="5" height="8" rx="1"/>
      <rect x="81" y="0" width="5" height="8" rx="1"/>
      <rect x="88" y="0" width="5" height="8" rx="1"/>
    </g>
    <!-- Bewegliche Klinge (leicht versetzt) -->
    <g fill="#aaa" opacity="0.9">
      <rect x="7"  y="1" width="4" height="7" rx="1"/>
      <rect x="14" y="1" width="4" height="7" rx="1"/>
      <rect x="21" y="1" width="4" height="7" rx="1"/>
      <rect x="28" y="1" width="4" height="7" rx="1"/>
      <rect x="35" y="1" width="4" height="7" rx="1"/>
      <rect x="42" y="1" width="4" height="7" rx="1"/>
      <rect x="49" y="1" width="4" height="7" rx="1"/>
      <rect x="56" y="1" width="4" height="7" rx="1"/>
      <rect x="63" y="1" width="4" height="7" rx="1"/>
      <rect x="70" y="1" width="4" height="7" rx="1"/>
      <rect x="77" y="1" width="4" height="7" rx="1"/>
      <rect x="84" y="1" width="4" height="7" rx="1"/>
    </g>
  </g>

  <!-- ===== TRIMMER (rechts) ===== -->
  <g filter="url(#shadow)" transform="translate(570, 90)">

    <!-- Körper (schmaler) -->
    <rect x="10" y="30" width="72" height="330" rx="16" fill="url(#trimBodyGrad)"/>

    <!-- Akzentstreifen -->
    <rect x="10" y="30" width="8" height="330" rx="5" fill="#c8a84b" opacity="0.6"/>
    <rect x="74" y="30" width="8" height="330" rx="5" fill="#c8a84b" opacity="0.3"/>

    <!-- Saber Logo -->
    <rect x="20" y="85" width="52" height="22" rx="4" fill="#1a1a28" opacity="0.9"/>
    <text x="46" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#c8a84b" letter-spacing="2">SABER</text>

    <!-- Power-Button -->
    <circle cx="46" cy="150" r="15" fill="#111" stroke="#c8a84b" stroke-width="1.5"/>
    <circle cx="46" cy="150" r="9" fill="#1a1a1a" stroke="#c8a84b" stroke-width="1"/>
    <path d="M46 141 L46 150" stroke="#c8a84b" stroke-width="2" stroke-linecap="round"/>
    <path d="M39 144 A9 9 0 1 0 53 144" fill="none" stroke="#c8a84b" stroke-width="2" stroke-linecap="round"/>

    <!-- LED -->
    <rect x="22" y="178" width="44" height="5" rx="2.5" fill="#c8a84b" opacity="0.9" filter="url(#glow)"/>

    <!-- Grip -->
    <g opacity="0.2">
      <rect x="18" y="205" width="46" height="2.5" rx="1.25" fill="#aaa"/>
      <rect x="18" y="213" width="46" height="2.5" rx="1.25" fill="#aaa"/>
      <rect x="18" y="221" width="46" height="2.5" rx="1.25" fill="#aaa"/>
      <rect x="18" y="229" width="46" height="2.5" rx="1.25" fill="#aaa"/>
      <rect x="18" y="237" width="46" height="2.5" rx="1.25" fill="#aaa"/>
      <rect x="18" y="245" width="46" height="2.5" rx="1.25" fill="#aaa"/>
      <rect x="18" y="253" width="46" height="2.5" rx="1.25" fill="#aaa"/>
    </g>

    <!-- Akku -->
    <rect x="26" y="290" width="36" height="12" rx="3" fill="#111" stroke="#333" stroke-width="1"/>
    <rect x="28" y="292" width="28" height="8" rx="2" fill="#c8a84b" opacity="0.6"/>
    <rect x="62" y="294" width="3" height="5" rx="1" fill="#333"/>

    <!-- USB-C -->
    <rect x="30" y="350" width="22" height="7" rx="3.5" fill="#0a0a14" stroke="#444" stroke-width="1"/>

    <!-- Klinge oben (schmaler) -->
    <rect x="6" y="6" width="80" height="28" rx="4" fill="url(#bladeGrad)"/>
    <rect x="10" y="2" width="72" height="8" rx="2" fill="#bbb"/>
    <!-- Klingen-Zähne Trimmer (feiner) -->
    <g fill="#888">
      <rect x="12" y="0" width="3.5" height="5" rx="0.8"/>
      <rect x="17" y="0" width="3.5" height="5" rx="0.8"/>
      <rect x="22" y="0" width="3.5" height="5" rx="0.8"/>
      <rect x="27" y="0" width="3.5" height="5" rx="0.8"/>
      <rect x="32" y="0" width="3.5" height="5" rx="0.8"/>
      <rect x="37" y="0" width="3.5" height="5" rx="0.8"/>
      <rect x="42" y="0" width="3.5" height="5" rx="0.8"/>
      <rect x="47" y="0" width="3.5" height="5" rx="0.8"/>
      <rect x="52" y="0" width="3.5" height="5" rx="0.8"/>
      <rect x="57" y="0" width="3.5" height="5" rx="0.8"/>
      <rect x="62" y="0" width="3.5" height="5" rx="0.8"/>
      <rect x="67" y="0" width="3.5" height="5" rx="0.8"/>
      <rect x="72" y="0" width="3.5" height="5" rx="0.8"/>
    </g>
    <g fill="#aaa" opacity="0.9">
      <rect x="14" y="0.5" width="2.5" height="4.5" rx="0.6"/>
      <rect x="19" y="0.5" width="2.5" height="4.5" rx="0.6"/>
      <rect x="24" y="0.5" width="2.5" height="4.5" rx="0.6"/>
      <rect x="29" y="0.5" width="2.5" height="4.5" rx="0.6"/>
      <rect x="34" y="0.5" width="2.5" height="4.5" rx="0.6"/>
      <rect x="39" y="0.5" width="2.5" height="4.5" rx="0.6"/>
      <rect x="44" y="0.5" width="2.5" height="4.5" rx="0.6"/>
      <rect x="49" y="0.5" width="2.5" height="4.5" rx="0.6"/>
      <rect x="54" y="0.5" width="2.5" height="4.5" rx="0.6"/>
      <rect x="59" y="0.5" width="2.5" height="4.5" rx="0.6"/>
      <rect x="64" y="0.5" width="2.5" height="4.5" rx="0.6"/>
      <rect x="69" y="0.5" width="2.5" height="4.5" rx="0.6"/>
    </g>
  </g>

  <!-- ===== MITTELBEREICH: Aufsätze ===== -->
  <!-- Guard-Kämme Darstellung -->
  <g transform="translate(390, 190)">
    <text x="60" y="0" text-anchor="middle" font-size="11" fill="#666" letter-spacing="1">GUARDS</text>
    <!-- 6 Kämme gestaffelt -->
    <g fill="#2a2a2a" stroke="#555" stroke-width="0.8">
      <rect x="20" y="12" width="18" height="50" rx="3"/>
      <rect x="25" y="8" width="8" height="16" rx="1.5" fill="#444"/>
      <rect x="33" y="12" width="18" height="55" rx="3"/>
      <rect x="38" y="8" width="8" height="16" rx="1.5" fill="#444"/>
      <rect x="46" y="12" width="18" height="60" rx="3"/>
      <rect x="51" y="8" width="8" height="16" rx="1.5" fill="#444"/>
      <rect x="59" y="12" width="18" height="65" rx="3"/>
      <rect x="64" y="8" width="8" height="16" rx="1.5" fill="#444"/>
      <rect x="72" y="12" width="18" height="70" rx="3"/>
      <rect x="77" y="8" width="8" height="16" rx="1.5" fill="#444"/>
      <rect x="85" y="12" width="18" height="75" rx="3"/>
      <rect x="90" y="8" width="8" height="16" rx="1.5" fill="#444"/>
    </g>
    <text x="29" y="78" text-anchor="middle" font-size="8" fill="#555">3</text>
    <text x="42" y="83" text-anchor="middle" font-size="8" fill="#555">6</text>
    <text x="55" y="88" text-anchor="middle" font-size="8" fill="#555">9</text>
    <text x="68" y="93" text-anchor="middle" font-size="8" fill="#555">12</text>
    <text x="81" y="98" text-anchor="middle" font-size="8" fill="#555">16</text>
    <text x="94" y="103" text-anchor="middle" font-size="8" fill="#555">19</text>
    <text x="60" y="118" text-anchor="middle" font-size="9" fill="#444">mm</text>
  </g>

  <!-- ===== BESCHRIFTUNGEN ===== -->

  <!-- Clipper Label -->
  <text x="210" y="510" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="1">CLIPPER</text>
  <text x="210" y="532" text-anchor="middle" font-size="12" fill="#888">45mm · Rotationsmotor · IPX5</text>
  <text x="210" y="550" text-anchor="middle" font-size="11" fill="#00e5ff">90 min · 3–25 mm</text>

  <!-- Trimmer Label -->
  <text x="616" y="510" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="1">TRIMMER</text>
  <text x="616" y="532" text-anchor="middle" font-size="12" fill="#888">32mm · Linearmotor · IPX7</text>
  <text x="616" y="550" text-anchor="middle" font-size="11" fill="#c8a84b">60 min · 1–10 mm</text>

  <!-- Set Title -->
  <text x="450" y="52" text-anchor="middle" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="4">SABER</text>
  <text x="450" y="76" text-anchor="middle" font-size="16" font-weight="300" fill="#c8a84b" letter-spacing="8">2.0 CLIPPER SET</text>

  <!-- Trennlinie -->
  <line x1="100" y1="88" x2="340" y2="88" stroke="#333" stroke-width="1"/>
  <line x1="560" y1="88" x2="800" y2="88" stroke="#333" stroke-width="1"/>

  <!-- Preise -->
  <rect x="340" y="380" width="220" height="110" rx="10" fill="#111" stroke="#222" stroke-width="1"/>
  <text x="450" y="405" text-anchor="middle" font-size="11" fill="#555" letter-spacing="1">SET-PREIS</text>
  <text x="450" y="435" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">129,99 €</text>
  <text x="450" y="458" text-anchor="middle" font-size="11" fill="#00e5ff">Sie sparen 19,99 €</text>
  <text x="450" y="478" text-anchor="middle" font-size="10" fill="#444">2 Jahre Garantie</text>

  <!-- Dot divider center -->
  <circle cx="450" cy="300" r="3" fill="#333"/>
  <circle cx="450" cy="315" r="3" fill="#2a2a2a"/>
  <circle cx="450" cy="330" r="3" fill="#222"/>

</svg>
